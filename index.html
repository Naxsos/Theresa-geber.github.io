<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ✏️  Personalise: the three lines below are what shows up in browser tabs and link previews -->
<title>My Mind Mapped</title>
<meta name="description" content="A giant hand-drawn mind map of a small fraction of what I'm learning about. Zoom in anywhere, or search it.">
<meta name="theme-color" content="#f7f4ec">

<script>
  // pick the theme before first paint (saved choice, otherwise the system setting)
  (function () {
    var t = null;
    try { t = localStorage.getItem('mind-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7f4ec'/%3E%3Cpath d='M9 10l7 6 8-5M16 16l-2 8' stroke='%232c3536' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='10' r='3' fill='%23f6c443'/%3E%3Ccircle cx='24' cy='11' r='3' fill='%2346c676'/%3E%3Ccircle cx='14' cy='24' r='3' fill='%230091fb'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%232c3536'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage" aria-label="Mind map">
  <canvas id="ink" role="img" aria-label="Hand-drawn mind map. Use the search box or the topic list to explore it."></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="labels"></div>
</main>

<aside class="panel" id="panel">
  <div class="brand">
    <!-- ✏️  Personalise: your title and one-line intro -->
    <h1><a id="home" href="./" title="Back to the whole map">My Mind Mapped</a></h1>
    <p>Partially. A hand-drawn map as a small excerpt of how I connect ideas in AI. Click anywhere to dive in.</p>
  </div>

  <div class="search" role="search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 17 17"/></svg>
    <input id="q" type="search" placeholder="Search the map&hellip;" autocomplete="off" autocapitalize="off" spellcheck="false"
           aria-label="Search the mind map" aria-controls="results" enterkeyhint="search">
    <kbd id="q-hint" aria-hidden="true">/</kbd>
    <button id="q-clear" type="button" aria-label="Clear search" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
  </div>

  <div class="results" id="results-wrap" hidden>
    <div class="results-head" id="results-head" aria-live="polite"></div>
    <ul id="results" role="listbox" aria-label="Search results"></ul>
  </div>

  <nav class="topics" id="topics-wrap" aria-label="Topics">
    <button class="topics-toggle" id="topics-toggle" type="button" aria-expanded="false" aria-controls="topics">
      <span>Explore topics</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
    </button>
    <ul id="topics"></ul>
  </nav>
</aside>

<div class="minimap" id="minimap" aria-hidden="true"><canvas id="mini"></canvas></div>

<div class="controls" role="group" aria-label="Map controls">
  <button id="btn-theme" type="button" aria-label="Switch between light and dark" title="Light / dark">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 11.6A6.8 6.8 0 0 1 8.4 3.5a6.8 6.8 0 1 0 8.1 8.1z"/></svg>
  </button>
  <span class="sep"></span>
  <button id="btn-in" type="button" aria-label="Zoom in" title="Zoom in (+)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
  </button>
  <button id="btn-out" type="button" aria-label="Zoom out" title="Zoom out (&minus;)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg>
  </button>
  <button id="btn-fit" type="button" aria-label="Show the whole map" title="Whole map (0)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></svg>
  </button>
</div>

<div class="hint" id="hint" aria-hidden="true">
  <span>Scroll to zoom</span><i></i><span>Drag to move</span><i></i><span>Click to dive in</span>
</div>

<div class="loader" id="loader"><span>Unfolding the map&hellip;</span></div>
<noscript><p class="noscript">This mind map needs JavaScript to draw itself.</p></noscript>

<script src="data/strokes.js"></script>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
